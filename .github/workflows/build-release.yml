name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Download Official OBS Windows Dependencies
        shell: pwsh
        run: |
          Write-Host "Downloading pre-built obs-deps and Qt6 (Official OBS Project)..."
          New-Item -ItemType Directory -Path "deps" -Force
          New-Item -ItemType Directory -Path "obs-src" -Force

          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/2025-07-11/windows-deps-2025-07-11-x64.zip" -OutFile deps.zip
          tar.exe -xf deps.zip -C deps

          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-deps/releases/download/2025-07-11/windows-deps-qt6-2025-07-11-x64.zip" -OutFile qt6.zip
          tar.exe -xf qt6.zip -C deps

          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/30.0.0.zip" -OutFile obs-src.zip
          tar.exe -xf obs-src.zip -C obs-src

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -DQt6_DIR="${{ github.workspace }}/deps/bin/Qt6" `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps"

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Package Drop-in Zip (1 Single Folder)
        shell: pwsh
        run: |
          $pkgDir = "dropin-package"
          New-Item -ItemType Directory -Path "$pkgDir/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "$pkgDir/data/obs-plugins/obs-audio-router/locale" -Force

          Copy-Item "build/Release/obs-audio-router.dll" "$pkgDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          Copy-Item "build/obs-audio-router.dll" "$pkgDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          Copy-Item -Path "data/locale/*" -Destination "$pkgDir/data/obs-plugins/obs-audio-router/locale/"

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "obs-audio-router-windows-x64.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: obs-audio-router-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
