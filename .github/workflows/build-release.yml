name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Download Official OBS SDK and Generate Import Libraries
        shell: pwsh
        run: |
          Write-Host "Setting up OBS headers and linking libraries..."
          New-Item -ItemType Directory -Path "deps" -Force
          New-Item -ItemType Directory -Path "obs-src" -Force

          # Download OBS source headers
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/30.0.0.zip" -OutFile obs-src.zip
          tar.exe -xf obs-src.zip -C obs-src

          # Download OBS binaries
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/30.0.0/OBS-Studio-30.0.zip" -OutFile obs-bin.zip
          tar.exe -xf obs-bin.zip -C deps

          # Generate MSVC import libraries (.lib) from obs.dll and obs-frontend-api.dll
          $binDir = "deps/bin/64bit"
          
          function Generate-ImportLib($dllPath, $libPath, $defName) {
              $exports = dumpbin /EXPORTS $dllPath
              $defContent = [System.Collections.Generic.List[string]]::new()
              $defContent.Add("EXPORTS")
              foreach ($line in $exports) {
                  if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                      $defContent.Add("    " + $matches[1])
                  }
              }
              [System.IO.File]::WriteAllLines($defName, $defContent)
              lib /def:$defName /machine:X64 /out:$libPath
          }

          Generate-ImportLib "$binDir/obs.dll" "$binDir/obs.lib" "obs.def"
          Generate-ImportLib "$binDir/obs-frontend-api.dll" "$binDir/obs-frontend-api.lib" "obs-frontend-api.def"
          
          Write-Host "Generated obs.lib and obs-frontend-api.lib successfully!"

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin and Bridge
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Package Staging and Standalone Drop-in Zip
        shell: pwsh
        run: |
          $stagingDir = (New-Item -ItemType Directory -Path "staging" -Force).FullName
          New-Item -ItemType Directory -Path "$stagingDir/obs-plugins/64bit" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stagingDir/data/obs-plugins/obs-audio-router/locale" -Force | Out-Null

          $dllFile = (Get-ChildItem -Recurse build -Filter "obs-audio-router.dll" | Select-Object -First 1)
          if (-not $dllFile) { throw "obs-audio-router.dll not found in build directory!" }
          Copy-Item $dllFile.FullName "$stagingDir/obs-plugins/64bit/obs-audio-router.dll" -Force

          Copy-Item -Path "data/locale/*" -Destination "$stagingDir/data/obs-plugins/obs-audio-router/locale/" -Force

          # Standalone assets
          Copy-Item "$stagingDir/obs-plugins/64bit/obs-audio-router.dll" "obs-audio-router.dll" -Force

          # Create drop-in zip
          Compress-Archive -Path "$stagingDir/*" -DestinationPath "obs-audio-router-windows-x64.zip" -Force

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.0" }
          $absStaging = (Resolve-Path "staging").Path
          $absDist = (New-Item -ItemType Directory -Path "dist" -Force).FullName
          Write-Host "Compiling Inno Setup installer for version $version..."
          Write-Host "SourceDir: $absStaging"
          Write-Host "OutputDir: $absDist"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer/setup.iss "/DAppVersion=$version" "/DSourceDir=$absStaging" "/DOutputDir=$absDist"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with code $LASTEXITCODE" }
          Get-ChildItem $absDist

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-audio-router-windows-x64
          path: |
            dist/*.exe
            obs-audio-router.dll
            obs-audio-router-windows-x64.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            obs-audio-router.dll
            obs-audio-router-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
