name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Download Official OBS SDK and Headers
        shell: pwsh
        run: |
          Write-Host "Downloading OBS Studio and pre-built dependencies..."
          New-Item -ItemType Directory -Path "deps" -Force
          New-Item -ItemType Directory -Path "obs-src" -Force

          # Download OBS source for libobs and obs-frontend-api headers
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/archive/refs/tags/30.0.0.zip" -OutFile obs-src.zip
          tar.exe -xf obs-src.zip -C obs-src

          # Download official OBS windows binaries for linking (URL real do release 30.0.0)
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/30.0.0/OBS-Studio-30.0.zip" -OutFile obs-bin.zip
          tar.exe -xf obs-bin.zip -C deps

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Package Drop-in Zip (1 Single Folder)
        shell: pwsh
        run: |
          $pkgDir = "dropin-package"
          New-Item -ItemType Directory -Path "$pkgDir/obs-plugins/64bit" -Force
          New-Item -ItemType Directory -Path "$pkgDir/data/obs-plugins/obs-audio-router/locale" -Force

          Copy-Item "build/Release/obs-audio-router.dll" "$pkgDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          Copy-Item "build/obs-audio-router.dll" "$pkgDir/obs-plugins/64bit/" -ErrorAction SilentlyContinue
          Copy-Item -Path "data/locale/*" -Destination "$pkgDir/data/obs-plugins/obs-audio-router/locale/"

          Compress-Archive -Path "$pkgDir/*" -DestinationPath "obs-audio-router-windows-x64.zip" -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: obs-audio-router-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
