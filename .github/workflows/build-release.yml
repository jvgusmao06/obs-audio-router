name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja & CMake
        uses: lukka/get-cmake@latest

      - name: Setup Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Download & Extract OBS Studio Dev SDK
        shell: pwsh
        run: |
          $obsVersion = "30.0.2"
          $obsUrl = "https://github.com/obsproject/obs-studio/releases/download/$obsVersion/OBS-Studio-$obsVersion-Windows.zip"
          Invoke-WebRequest -Uri $obsUrl -OutFile obs-studio.zip
          Expand-Archive -Path obs-studio.zip -DestinationPath obs-dev

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_BUILD_TYPE=Release `
            -Dobs-studio_DIR="${{ github.workspace }}/obs-dev"

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Package Plugin (Drop-in Zip)
        shell: pwsh
        run: |
          # Cria a estrutura de 1 pasta única para o usuário
          $pkgDir = "release-package/obs-audio-router"
          New-Item -ItemType Directory -Path "$pkgDir/bin/64bit" -Force
          New-Item -ItemType Directory -Path "$pkgDir/data/locale" -Force

          # Copia a DLL compilada e os arquivos de tradução
          Copy-Item "build/Release/obs-audio-router.dll" "$pkgDir/bin/64bit/" -ErrorAction SilentlyContinue
          Copy-Item "build/obs-audio-router.dll" "$pkgDir/bin/64bit/" -ErrorAction SilentlyContinue
          Copy-Item -Path "data/locale/*" -Destination "$pkgDir/data/locale/"

          # Compacta em um único arquivo zip
          Compress-Archive -Path "release-package/*" -DestinationPath "obs-audio-router.zip"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: obs-audio-router.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

